<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>預約您的專屬課程</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap');
:root{
  --bg-base:#050507;
  --bg-surface:#0f1015;
  --accent:#e2f063; /* 亮黃綠色 */
  --text-main:#ffffff;
  --text-muted:#8a8d98;
  --danger:#ff6b6b;
}
body {
  background-color: var(--bg-base);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
  margin: 0; padding: 20px;
}
.booking-container {
  max-width: 500px;
  margin: 0 auto;
  background: var(--bg-surface);
  border-radius: 24px;
  padding: 24px;
  border: 1px solid rgba(255,255,255,0.05);
}
h2 { font-family: 'Manrope'; margin-top: 0; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
.form-group input, .form-group select {
  width: 100%; padding: 12px; border-radius: 12px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-main); box-sizing: border-box; font-size: 16px;
}
.btn-submit {
  width: 100%; padding: 16px; background: var(--accent); color: #000;
  border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer;
  box-shadow: 0 8px 24px rgba(226,240,99,0.2);
}
.btn-submit:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }
.hidden{ display:none !important; }
.inline-banner{
  background:rgba(255,107,107,0.12); border:1px solid rgba(255,107,107,0.35);
  color:#ffb3b3; padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:18px; line-height:1.5;
}
.welcome-row{
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(226,240,99,0.08); border:1px solid rgba(226,240,99,0.25);
  padding:12px 14px; border-radius:12px; margin-bottom:20px; font-size:14px;
}
.welcome-row a{ color:var(--accent); text-decoration:underline; cursor:pointer; }
.loading-text{ color:var(--text-muted); font-size:14px; }
/* Toast 提示框 */
#toast{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:rgba(255,255,255,0.95); color:#000; padding:12px 24px; border-radius:30px; font-weight:600; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.3); transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); z-index:9999; pointer-events:none; text-align:center; min-width:200px; }
#toast.show{ transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="booking-container">
  <h2 id="coachNameTitle">📅 線上預約課程</h2>
  <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;" id="pageSubtitle">請先確認您的學員身分，即可查看可預約時段。</p>

  <div id="loadErrorBanner" class="inline-banner hidden"></div>

  <!-- 步驟一：身分驗證（姓名 + 電話），須為教練名單中已存在的學員 -->
  <form id="identityForm">
    <div id="identityErrorBanner" class="inline-banner hidden"></div>
    <div class="form-group">
      <label><i class="fa-regular fa-user"></i> 學員真實姓名</label>
      <input type="text" id="identityName" placeholder="請輸入您的本名" required>
    </div>
    <div class="form-group">
      <label><i class="fa-solid fa-mobile-screen-button"></i> 手機號碼</label>
      <input type="tel" id="identityPhone" placeholder="例如：0912345678" pattern="[0-9]{8,10}" required>
    </div>
    <button type="submit" class="btn-submit" id="identitySubmitBtn">確認身分</button>
  </form>

  <!-- 步驟二：驗證成功後才顯示的預約表單 -->
  <div id="bookingSection" class="hidden">
    <div class="welcome-row">
      <span id="welcomeText">您好！</span>
      <a id="switchIdentityLink">非本人？重新輸入</a>
    </div>

    <form id="bookingForm">
      <div class="form-group">
        <label><i class="fa-regular fa-calendar-days"></i> 選擇可用課堂時段</label>
        <select id="slotSelect" required>
          <option value="">-- 載入中 --</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">確認送出預約</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
// 初始化 Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBntQjf3bfUMup3Wue1zO4dqcyrRDjKTf8",
  authDomain: "cocah-7dc25.firebaseapp.com",
  projectId: "cocah-7dc25",
  storageBucket: "cocah-7dc25.firebasestorage.app",
  messagingSenderId: "258674160798",
  appId: "1:258674160798:web:29e01d9b1f2dba7964b78f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 💡 從網址列解析教練的「專屬代號 slug」(?coach=daisy)，而非直接使用 uid
const urlParams = new URLSearchParams(window.location.search);
const coachSlug = urlParams.get('coach');
let coachUid = null;
let verifiedStudent = null; // { id, name, phone }
const STORAGE_KEY = coachSlug ? `booking_identity_${coachSlug}` : null;

const loadErrorBanner = document.getElementById('loadErrorBanner');
const identityErrorBanner = document.getElementById('identityErrorBanner');

if (!coachSlug) {
  showLoadError('⚠️ 預約網址無效，請重新向教練索取正確的約課連結。');
} else {
  resolveCoachAndLoad();
}

// 0. 先用代號查出真正的教練 uid
function resolveCoachAndLoad(){
  db.collection('coachSlugs').doc(coachSlug).get().then(doc => {
    if(!doc.exists){
      showLoadError('⚠️ 找不到這位教練，請確認連結是否正確，或重新向教練索取。');
      return;
    }
    coachUid = doc.data().uid;
    loadCoachData();
    tryRestoreIdentity();
  }).catch(err=>{
    console.error('查詢教練代號失敗:', err);
    showLoadError('⚠️ 載入失敗，可能是網路問題或權限設定尚未開放，請稍後再試，或請教練確認 Firestore 權限設定。');
  });
}

// 1. 載入教練名稱
function loadCoachData() {
  db.collection('coaches').doc(coachUid).get().then(doc => {
    if (doc.exists && doc.data().name) {
      document.getElementById('coachNameTitle').innerText = `📅 預約 ${doc.data().name} 的課程`;
    }
  }).catch(err=>{
    console.error('載入教練資料失敗:', err);
  });
}

// 若此裝置先前已驗證過身分，直接帶入不用重填
function tryRestoreIdentity(){
  if(!STORAGE_KEY) return;
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(saved && saved.name && saved.phone){
      document.getElementById('identityName').value = saved.name;
      document.getElementById('identityPhone').value = saved.phone;
      verifyIdentity(saved.name, saved.phone, true);
    }
  }catch(e){ /* 忽略壞掉的快取 */ }
}

function showLoadError(msg){
  loadErrorBanner.innerText = msg;
  loadErrorBanner.classList.remove('hidden');
  document.getElementById('identityForm').classList.add('hidden');
}

function showIdentityError(msg){
  identityErrorBanner.innerText = msg;
  identityErrorBanner.classList.remove('hidden');
}

function clearIdentityError(){
  identityErrorBanner.classList.add('hidden');
}

// 2. 身分驗證表單送出
document.getElementById('identityForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('identityName').value.trim();
  const phone = document.getElementById('identityPhone').value.trim();
  verifyIdentity(name, phone, false);
});

// 核心驗證：必須在教練的學員名單（students 集合）中已經存在，才能繼續預約
function verifyIdentity(name, phone, silent){
  clearIdentityError();
  const btn = document.getElementById('identitySubmitBtn');
  btn.disabled = true; btn.innerText = '確認中...';

  db.collection('coaches').doc(coachUid).collection('students')
    .where('phone', '==', phone).get()
    .then(snapshot => {
      btn.disabled = false; btn.innerText = '確認身分';

      if(snapshot.empty){
        if(!silent){
          showIdentityError('❌ 查無此學員資料，請確認手機號碼是否正確，或請先聯繫教練將您加入學員名單後再預約。');
        }
        return;
      }

      // 電話相符即視為同一位學員（姓名僅供顯示核對，不一致時仍以電話為準並提醒）
      let matched = null;
      snapshot.forEach(doc => {
        const d = doc.data();
        if(!matched && d.name && name && d.name.trim() === name.trim()){
          matched = { id: doc.id, name: d.name, phone: d.phone };
        }
      });
      if(!matched){
        const first = snapshot.docs[0];
        matched = { id: first.id, name: first.data().name, phone: first.data().phone };
      }

      verifiedStudent = matched;
      if(STORAGE_KEY){
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ name: matched.name, phone: matched.phone }));
      }
      enterBookingStep();
    })
    .catch(err=>{
      btn.disabled = false; btn.innerText = '確認身分';
      console.error('驗證學員身分失敗:', err);
      if(!silent){
        showIdentityError('⚠️ 驗證失敗，可能是網路問題或權限設定尚未開放，請稍後再試，或請教練確認 Firestore 權限設定。');
      }
    });
}

function enterBookingStep(){
  document.getElementById('identityForm').classList.add('hidden');
  document.getElementById('pageSubtitle').classList.add('hidden');
  document.getElementById('bookingSection').classList.remove('hidden');
  document.getElementById('welcomeText').innerText = `您好，${verifiedStudent.name}！`;
  loadAvailableSlots();
}

document.getElementById('switchIdentityLink').addEventListener('click', function(){
  verifiedStudent = null;
  if(STORAGE_KEY) localStorage.removeItem(STORAGE_KEY);
  document.getElementById('bookingSection').classList.add('hidden');
  document.getElementById('pageSubtitle').classList.remove('hidden');
  document.getElementById('identityForm').classList.remove('hidden');
  document.getElementById('identityName').value = '';
  document.getElementById('identityPhone').value = '';
  clearIdentityError();
});

// 3. 抓取該教練目前所有狀態為 "open" 的時段（僅在身分驗證通過後才會呼叫）
function loadAvailableSlots() {
  const selectEl = document.getElementById('slotSelect');
  selectEl.innerHTML = '<option value="">-- 載入中 --</option>';

  db.collection('coaches').doc(coachUid).collection('slots')
    .where('status', '==', 'open')
    .orderBy('timestamp', 'asc')
    .get()
    .then(snapshot => {
      if(snapshot.empty) {
        selectEl.innerHTML = '<option value="">目前教練暫無開放空檔</option>';
        return;
      }
      selectEl.innerHTML = '<option value="">-- 請選擇時段 --</option>';
      snapshot.forEach(doc => {
        const slot = doc.data();
        const option = document.createElement('option');
        option.value = doc.id;
        option.innerText = slot.time;
        selectEl.appendChild(option);
      });
    }).catch(err => {
      console.error("載入時段失敗:", err);
      selectEl.innerHTML = '<option value="">⚠️ 時段載入失敗</option>';
      showToast('⚠️ 時段載入失敗，請重新整理或聯繫教練確認權限設定');
    });
}

// 4. 處理學員送出預約表單（此時身分已驗證，不再需要重填姓名電話、也不再自動建立新學員）
document.getElementById('bookingForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if(!verifiedStudent){
    showToast('❌ 請先完成身分確認');
    return;
  }

  const slotId = document.getElementById('slotSelect').value;
  if(!slotId) {
    showToast('❌ 請先選擇上課時段');
    return;
  }

  const slotRef = db.collection('coaches').doc(coachUid).collection('slots').doc(slotId);

  slotRef.update({
    status: 'full',
    studentId: verifiedStudent.id,
    studentName: verifiedStudent.name,
    studentPhone: verifiedStudent.phone,
    bookedAt: firebase.firestore.FieldValue.serverTimestamp()
  })
  .then(() => {
    showToast('🎉 預約成功！教練已收到您的預約。');
    setTimeout(() => { loadAvailableSlots(); }, 1500);
  })
  .catch(err => {
    console.error('預約失敗:', err);
    showToast('❌ 預約失敗，該時段可能剛被別人搶先約走了！');
  });
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
